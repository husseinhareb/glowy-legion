[package]
name = "glowy-legion"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "glowy_legion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SAFETY: never use a libusb backend here. libusb claims USB interfaces and can
# detach the kernel driver from the internal keyboard's HID interface, which
# kills keyboard input system-wide even after the app exits. hidraw opens
# /dev/hidrawN nodes without detaching kernel drivers.
hidapi = { version = "2.6.3", default-features = false, features = ["linux-static-hidraw"] }
thiserror = "2"
